name: Deploy to GitHub Pages and Schedule Ingestion

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 1. Monitoreo Liviano de Servicios Publicos (06:00, 12:00 y 22:00 Arg · UTC-3)
    # Cron en UTC (09:00, 15:00 y 01:00 UTC):
    - cron: '0 1,9,15 * * *'
    # 2. Sincronizacion Principal Diaria (Comunicados, Expensas Dias 1-12 y Servicios): 17:00 Arg (20:00 UTC)
    # Cron en UTC:
    - cron: '0 20 * * *'

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clonar historial para commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Update Mode
        id: mode-selector
        run: |
          CURRENT_HOUR_UTC=$(date -u +%H)
          CURRENT_DAY=$(date +%d)
          # Modo completo si:
          # - Es activado por push o workflow_dispatch manual
          # - Es la corrida principal diaria de las 17:00 Arg (20:00 UTC)
          # - Estamos en la ventana activa de publicacion de expensas (dias 1 al 12 del mes)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$CURRENT_HOUR_UTC" = "20" ] || [ "$CURRENT_DAY" -le 12 ]; then
            echo "MODE=--all" >> $GITHUB_ENV
            echo "Determined Update Mode: --all (Full sync: Comunicados + Expensas + Servicios)"
          else
            echo "MODE=--services-only" >> $GITHUB_ENV
            echo "Determined Update Mode: --services-only (Lightweight utility check)"
          fi

      - name: Run Update Script
        env:
          CONSORCIOABIERTO_EMAIL: ${{ secrets.CONSORCIOABIERTO_EMAIL }}
          CONSORCIOABIERTO_PASSWORD: ${{ secrets.CONSORCIOABIERTO_PASSWORD }}
        run: |
          python cron_update.py ${{ env.MODE }}

      - name: Commit Database and Status Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gastos.json prorrateo.json servicios_status.json data_ipc_indec.json forensic_audit.json liquidaciones/ data_consorcioabierto/
          # Hacer commit solo si hay cambios en staging para evitar fallar el job
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-update): sync database and status data [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in utility status or PDF database."
          fi

      # Deploy: Vercel auto-despliega desde la rama main al detectar el push.
      # Configuración del dominio en: vercel.com → sarmiento-360 → Settings → Domains
      # Dominio personalizado: alexismartyniuk.com.ar con prefijo de ruta /sarmiento-360
